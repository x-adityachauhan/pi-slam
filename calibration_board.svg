<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <defs><pattern id="board" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="white"/>
    <rect width="20" height="20" fill="black"/>
    <rect x="20" y="20" width="20" height="20" fill="black"/>
  </pattern></defs>
  <rect width="210" height="297" fill="white"/>
  <text x="105" y="40" text-anchor="middle" font-family="sans-serif" font-size="5">Pi Camera calibration — print at 100% scale</text>
  <text x="105" y="50" text-anchor="middle" font-family="sans-serif" font-size="4">9 × 6 inner corners; each square should measure 20 mm</text>
  <g transform="translate(5,78)"><rect width="200" height="140" fill="url(#board)"/></g>
  <text x="105" y="240" text-anchor="middle" font-family="sans-serif" font-size="4">Mount flat. Show the entire board at varied positions and tilts.</text>
  <text x="105" y="250" text-anchor="middle" font-family="sans-serif" font-size="4">Measure a printed square and enter its actual size during calibration.</text>
</svg>
